  STR_CUI_TEST_MAIN_HELP_TITLE: "What the Main test demonstrates"
  STR_CUI_TEST_MAIN_HELP_TEXT: "CONTROLS\nON / OFF stores a local true/false value. TEXT INPUT demonstrates typing, change events, Enter submission, placeholder text, and a length limit. NUMBER supports typing, arrow buttons, mouse wheel, limits, wrapping, and larger Ctrl/Shift steps.\n\nTABLE\nSEARCH filters the research table immediately. Click a column heading to sort ascending; click it again for descending. The native up/down icon marks the active direction. Clicking a row displays its stable ruleset ID. These controls do not alter your save.\n\nACTIONS\nRUN DEMO calls the controlled script API and increments Number. SCRIPT APIS opens more script tests. VISUAL TESTS explains layering, colors, dropdowns, text focus, and alignment. CROSS-MOD opens a UI owned by the companion mod. NATIVE UI opens the game tech tree. REPLACE UI demonstrates replacement navigation. ALL 9 ANCHORS tests positioning.\n\nSCROLLING\nThis help text deliberately exceeds its viewport. autoScrollbars keeps the bar inside the widget and lets the mouse wheel or scrollbar reach all content."
  STR_CUI_TEST_CONTROLS_HELP: "TOGGLE stores a local true/false value. TEXT INPUT demonstrates typing, change events, Enter submission, placeholder text, and a length limit. NUMBER supports typing, arrow buttons, mouse wheel, limits, wrapping, and larger Ctrl/Shift steps."
  STR_CUI_TEST_TABLE_HELP: "SEARCH filters the research table immediately. SORT TABLE chooses a field; DESCENDING reverses it. Clicking a row displays its stable ruleset ID. These table controls do not alter your save."
  STR_CUI_TEST_NAVIGATION_HELP: "RUN DEMO calls the controlled script API and increments Number. SCRIPT APIS opens more script tests. VISUALS tests colors and overlap. CROSS-MOD opens the companion mod. NATIVE UI opens the game tech tree. REPLACE UI demonstrates replacement navigation; ALL 9 ANCHORS tests positioning."

